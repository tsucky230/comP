[package]
name = "comp-daemon"
version = "0.12.1"
edition = "2021"
authors = ["comP Contributors"]
license = "MIT"
description = "Local-first code indexing daemon for AI agents"

[[bin]]
name = "comp-daemon"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
tree-sitter = "0.23"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
ignore = "0.4"
sha2 = "0.11"
regex = "1.10"
quick-xml = "0.41"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
tree-sitter-rust = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tree-sitter-html = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-java = "0.23"
lopdf = "0.47"
# WHY default-features = false: comP reads only the footer metadata
# (read_metadata), which is never compressed. The default codecs pulled in
# zstd 0.12, whose zstd-safe/zstd-sys carry RUSTSEC-2026-0403/0410 and cannot
# be raised while parquet2 (no newer release) pins zstd ^0.12.
parquet2 = { version = "0.17.2", default-features = false }
tiktoken-rs = "0.12"

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.8"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
